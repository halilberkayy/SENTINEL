name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install linters
        run: pip install "ruff>=0.8,<0.9" "black>=24.1,<25"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Black (format check)
        run: black --check src tests

  typecheck:
    name: Type check (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mypy + runtime deps
        run: |
          pip install "mypy>=1.8,<2"
          pip install -r requirements.txt
      - name: Mypy
        run: mypy src
        continue-on-error: true # gradual typing: advisory, not a hard gate yet

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime + test deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run unit tests
        run: pytest tests/unit/ -v
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
        continue-on-error: true

  security:
    name: Security scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: pip install "bandit[toml]>=1.7.6,<2" pip-audit
      - name: Bandit
        run: bandit -c pyproject.toml -r src/ -ll -f json -o bandit-report.json
        continue-on-error: true
      - name: pip-audit
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t sentinel:ci .
      - name: Smoke test (registry loads, 57 modules)
        run: |
          docker run --rm sentinel:ci python -c "from src.core.scanner_engine import MODULE_REGISTRY; assert len(MODULE_REGISTRY) == 57, len(MODULE_REGISTRY); print('OK:', len(MODULE_REGISTRY), 'modules')"
