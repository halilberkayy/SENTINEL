name: "SENTINEL - Security Scanner"
description: "Run DAST security scans in CI/CD pipelines with SARIF output for GitHub Security integration"
author: "SENTINEL Security Team"

branding:
  icon: "shield"
  color: "red"

inputs:
  target_url:
    description: "Target URL to scan (must be http:// or https://)"
    required: true

  modules:
    description: 'Comma-separated list of modules to run (e.g., xss,sqli,ssrf). Use "all" for all modules'
    required: false
    default: "all"

  severity_threshold:
    description: "Fail the scan if vulnerabilities at or above this severity are found (critical, high, medium, low, info)"
    required: false
    default: "high"

  output_format:
    description: "Output format (sarif, json, html, txt)"
    required: false
    default: "sarif"

  output_file:
    description: "Path to save the scan results"
    required: false
    default: "scan_results.sarif"

  timeout:
    description: "Scan timeout in seconds (max 3600)"
    required: false
    default: "600"

  auth_type:
    description: "Authentication type (basic, form, jwt, cookie, api_key)"
    required: false

  auth_credentials:
    description: "JSON string with authentication credentials"
    required: false

  rate_limit:
    description: "Requests per second limit (1-100)"
    required: false
    default: "10"

  fail_on_vulnerability:
    description: "Whether to fail the workflow if vulnerabilities are found"
    required: false
    default: "true"

  upload_sarif:
    description: "Upload SARIF results to GitHub Security"
    required: false
    default: "true"

outputs:
  vulnerability_count:
    description: "Total number of vulnerabilities found"
    value: ${{ steps.scan.outputs.vulnerability_count }}

  critical_count:
    description: "Number of critical severity vulnerabilities"
    value: ${{ steps.scan.outputs.critical_count }}

  high_count:
    description: "Number of high severity vulnerabilities"
    value: ${{ steps.scan.outputs.high_count }}

  medium_count:
    description: "Number of medium severity vulnerabilities"
    value: ${{ steps.scan.outputs.medium_count }}

  low_count:
    description: "Number of low severity vulnerabilities"
    value: ${{ steps.scan.outputs.low_count }}

  scan_passed:
    description: "Whether the scan passed the severity threshold"
    value: ${{ steps.scan.outputs.scan_passed }}

  sarif_file:
    description: "Path to the SARIF output file"
    value: ${{ steps.scan.outputs.sarif_file }}

  report_url:
    description: "URL to the full HTML report (if generated)"
    value: ""

runs:
  using: "composite"
  steps:
    # Pin to SHA for supply-chain security
    - name: Set up Python
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5.0.0
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Cache pip dependencies
      uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9  # v4.0.2
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-sentinel-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-sentinel-

    - name: Validate inputs
      shell: bash
      run: |
        # Validate target URL format (prevent command injection)
        TARGET_URL="${{ inputs.target_url }}"
        if [[ ! "$TARGET_URL" =~ ^https?:// ]]; then
          echo "::error::Invalid target URL. Must start with http:// or https://"
          exit 1
        fi

        # Validate URL doesn't contain shell metacharacters
        if [[ "$TARGET_URL" =~ [\;\|\&\$\`\(\)\{\}] ]]; then
          echo "::error::Target URL contains invalid characters"
          exit 1
        fi

        # Validate timeout is numeric and within range
        TIMEOUT="${{ inputs.timeout }}"
        if ! [[ "$TIMEOUT" =~ ^[0-9]+$ ]] || [ "$TIMEOUT" -gt 3600 ] || [ "$TIMEOUT" -lt 30 ]; then
          echo "::error::Timeout must be a number between 30 and 3600"
          exit 1
        fi

        # Validate rate limit is numeric and within range
        RATE_LIMIT="${{ inputs.rate_limit }}"
        if ! [[ "$RATE_LIMIT" =~ ^[0-9]+$ ]] || [ "$RATE_LIMIT" -gt 100 ] || [ "$RATE_LIMIT" -lt 1 ]; then
          echo "::error::Rate limit must be a number between 1 and 100"
          exit 1
        fi

        # Validate severity threshold
        THRESHOLD="${{ inputs.severity_threshold }}"
        if [[ ! "$THRESHOLD" =~ ^(critical|high|medium|low|info)$ ]]; then
          echo "::error::Invalid severity threshold. Must be: critical, high, medium, low, or info"
          exit 1
        fi

        # Validate output format
        FORMAT="${{ inputs.output_format }}"
        if [[ ! "$FORMAT" =~ ^(sarif|json|html|txt)$ ]]; then
          echo "::error::Invalid output format. Must be: sarif, json, html, or txt"
          exit 1
        fi

        # Validate modules (alphanumeric, commas, underscores only)
        MODULES="${{ inputs.modules }}"
        if [[ ! "$MODULES" =~ ^[a-zA-Z0-9_,]+$ ]]; then
          echo "::error::Invalid modules format. Use comma-separated alphanumeric names"
          exit 1
        fi

    - name: Install scanner dependencies
      shell: bash
      run: |
        pip install --quiet --upgrade pip
        if [ -f requirements.txt ]; then
          pip install --quiet --no-cache-dir -r requirements.txt
        else
          echo "::error::requirements.txt not found"
          exit 1
        fi

    - name: Run vulnerability scan
      id: scan
      shell: bash
      timeout-minutes: 65
      env:
        # Pass inputs as environment variables (safer than direct interpolation)
        SCAN_TARGET_URL: ${{ inputs.target_url }}
        SCAN_MODULES: ${{ inputs.modules }}
        SCAN_SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
        SCAN_OUTPUT_FORMAT: ${{ inputs.output_format }}
        SCAN_OUTPUT_FILE: ${{ inputs.output_file }}
        SCAN_TIMEOUT: ${{ inputs.timeout }}
        SCAN_AUTH_TYPE: ${{ inputs.auth_type }}
        SCAN_AUTH_CREDENTIALS: ${{ inputs.auth_credentials }}
        SCAN_RATE_LIMIT: ${{ inputs.rate_limit }}
      run: |
        # Build command arguments using environment variables (not direct interpolation)
        ARGS="--url ${SCAN_TARGET_URL}"
        ARGS="${ARGS} --modules ${SCAN_MODULES}"
        ARGS="${ARGS} --output ${SCAN_OUTPUT_FORMAT}"
        ARGS="${ARGS} --output-file ${SCAN_OUTPUT_FILE}"
        ARGS="${ARGS} --timeout ${SCAN_TIMEOUT}"
        ARGS="${ARGS} --rate-limit ${SCAN_RATE_LIMIT}"

        if [ -n "${SCAN_AUTH_TYPE}" ]; then
          ARGS="${ARGS} --auth-type ${SCAN_AUTH_TYPE}"
        fi

        echo "Starting security scan on ${SCAN_TARGET_URL}"
        echo "Modules: ${SCAN_MODULES}"
        echo "Severity Threshold: ${SCAN_SEVERITY_THRESHOLD}"

        # Run scanner with timeout
        timeout "${SCAN_TIMEOUT}" python3 scanner.py ${ARGS} --json-summary > scan_summary.json 2>&1 || true

        # Parse results safely
        if [ -f scan_summary.json ] && python3 -c "import json; json.load(open('scan_summary.json'))" 2>/dev/null; then
          CRITICAL=$(python3 -c "import json; d=json.load(open('scan_summary.json')); print(d.get('severity_counts',{}).get('critical',0))")
          HIGH=$(python3 -c "import json; d=json.load(open('scan_summary.json')); print(d.get('severity_counts',{}).get('high',0))")
          MEDIUM=$(python3 -c "import json; d=json.load(open('scan_summary.json')); print(d.get('severity_counts',{}).get('medium',0))")
          LOW=$(python3 -c "import json; d=json.load(open('scan_summary.json')); print(d.get('severity_counts',{}).get('low',0))")
          TOTAL=$(python3 -c "import json; d=json.load(open('scan_summary.json')); print(d.get('total_vulnerabilities',0))")
        else
          echo "::warning::Could not parse scan results"
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0
          TOTAL=0
        fi

        echo "critical_count=${CRITICAL}" >> $GITHUB_OUTPUT
        echo "high_count=${HIGH}" >> $GITHUB_OUTPUT
        echo "medium_count=${MEDIUM}" >> $GITHUB_OUTPUT
        echo "low_count=${LOW}" >> $GITHUB_OUTPUT
        echo "vulnerability_count=${TOTAL}" >> $GITHUB_OUTPUT
        echo "sarif_file=${SCAN_OUTPUT_FILE}" >> $GITHUB_OUTPUT

        # Determine pass/fail based on threshold
        PASSED=true
        case ${SCAN_SEVERITY_THRESHOLD} in
          critical)
            [ "${CRITICAL}" -gt 0 ] && PASSED=false
            ;;
          high)
            [ "${CRITICAL}" -gt 0 ] || [ "${HIGH}" -gt 0 ] && PASSED=false
            ;;
          medium)
            [ "${CRITICAL}" -gt 0 ] || [ "${HIGH}" -gt 0 ] || [ "${MEDIUM}" -gt 0 ] && PASSED=false
            ;;
          low)
            [ "${CRITICAL}" -gt 0 ] || [ "${HIGH}" -gt 0 ] || [ "${MEDIUM}" -gt 0 ] || [ "${LOW}" -gt 0 ] && PASSED=false
            ;;
        esac

        echo "scan_passed=${PASSED}" >> $GITHUB_OUTPUT

        # Print summary
        echo ""
        echo "Scan Results Summary"
        echo "========================"
        echo "Critical: ${CRITICAL}"
        echo "High: ${HIGH}"
        echo "Medium: ${MEDIUM}"
        echo "Low: ${LOW}"
        echo "Total: ${TOTAL}"
        echo ""

        if [ "${PASSED}" = "true" ]; then
          echo "Scan passed severity threshold: ${SCAN_SEVERITY_THRESHOLD}"
        else
          echo "::warning::Scan failed severity threshold: ${SCAN_SEVERITY_THRESHOLD}"
        fi

    - name: Upload SARIF to GitHub Security
      if: ${{ inputs.upload_sarif == 'true' && inputs.output_format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@1b1aada464948af03b950897e5eb522f92603cc2  # v3.24.0
      with:
        sarif_file: ${{ inputs.output_file }}
        category: sentinel-vulnerability-scanner

    - name: Upload scan artifacts
      uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v4.3.1
      with:
        name: sentinel-scan-results
        path: |
          ${{ inputs.output_file }}
          scan_summary.json
        retention-days: 30

    - name: Check threshold and fail if needed
      if: ${{ inputs.fail_on_vulnerability == 'true' }}
      shell: bash
      run: |
        if [ "${{ steps.scan.outputs.scan_passed }}" = "false" ]; then
          echo "::error::Security scan failed! Vulnerabilities found above threshold."
          exit 1
        fi
