<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL - MITRE ATT&CK Heatmap</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent-red: #ff3333;
            --accent-green: #00ff88;
            --accent-yellow: #ffd700;
            --accent-blue: #4488ff;
            --border-color: #2a2a3e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--accent-red);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: var(--accent-red); font-size: 1.5rem; }
        .header nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.2s;
        }
        .header nav a:hover, .header nav a.active { color: var(--accent-red); }
        .container { max-width: 1600px; margin: 0 auto; padding: 2rem; }
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
        }
        .controls label { color: var(--text-secondary); }
        .controls select {
            padding: 0.4rem 0.8rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 4px;
        }
        .matrix-container { overflow-x: auto; }
        .matrix {
            display: flex;
            gap: 2px;
            min-width: max-content;
        }
        .tactic-column {
            min-width: 140px;
            max-width: 160px;
        }
        .tactic-header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.4rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--accent-red);
            border-radius: 4px 4px 0 0;
        }
        .technique-cell {
            border: 1px solid var(--border-color);
            padding: 0.4rem;
            margin-top: 2px;
            font-size: 0.7rem;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .technique-cell:hover { border-color: var(--accent-red); }
        .technique-cell .tech-id { color: var(--text-secondary); font-size: 0.65rem; }
        .technique-cell .tech-name { display: block; margin-top: 2px; }
        .technique-cell .tech-count {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--accent-red);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .heat-0 { background: var(--bg-card); }
        .heat-1 { background: rgba(68, 136, 255, 0.2); }
        .heat-2 { background: rgba(255, 215, 0, 0.2); }
        .heat-3 { background: rgba(255, 102, 51, 0.3); }
        .heat-high { background: rgba(255, 51, 51, 0.3); }

        .stats-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .stats-bar .stat {
            text-align: center;
        }
        .stats-bar .stat .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-red);
        }
        .stats-bar .stat .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .attack-chains {
            margin-top: 2rem;
        }
        .chain-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .chain-card .chain-title {
            font-weight: 600;
            color: var(--accent-red);
            margin-bottom: 0.5rem;
        }
        .chain-card .chain-risk {
            float: right;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .chain-card .chain-steps {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .chain-step {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
        }
        .chain-arrow { color: var(--accent-red); font-weight: bold; }
        .risk-high { color: var(--accent-red); }
        .risk-medium { color: var(--accent-yellow); }
        .risk-low { color: var(--accent-green); }
    </style>
</head>
<body>
    <div class="header">
        <h1>SENTINEL RED TEAM</h1>
        <nav>
            <a href="/">Scanner</a>
            <a href="/campaigns">Campaigns</a>
            <a href="/attack-map" class="active">ATT&CK Map</a>
        </nav>
    </div>

    <div class="container">
        <div class="controls">
            <label>Campaign:</label>
            <select id="campaign-select">
                <option value="">All campaigns</option>
            </select>
            <span id="loading-indicator" style="color:var(--text-secondary);display:none;">Loading...</span>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="value" id="stat-tactics">0</div>
                <div class="label">Tactics Covered</div>
            </div>
            <div class="stat">
                <div class="value" id="stat-techniques">0</div>
                <div class="label">Techniques Detected</div>
            </div>
            <div class="stat">
                <div class="value" id="stat-findings">0</div>
                <div class="label">Related Findings</div>
            </div>
        </div>

        <h2 style="color:var(--accent-red); margin-bottom:1rem;">MITRE ATT&CK Coverage Matrix</h2>
        <div class="matrix-container">
            <div class="matrix" id="mitre-matrix"></div>
        </div>

        <div class="attack-chains">
            <h2 style="color:var(--accent-red); margin-bottom:1rem;">Attack Chains</h2>
            <div id="attack-chains-container"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        function createElement(tag, attrs, children) {
            const el = document.createElement(tag);
            if (attrs) {
                for (const [key, value] of Object.entries(attrs)) {
                    if (key === 'className') el.className = value;
                    else el.setAttribute(key, value);
                }
            }
            if (children) {
                const arr = Array.isArray(children) ? children : [children];
                for (const child of arr) {
                    if (typeof child === 'string') el.appendChild(document.createTextNode(child));
                    else if (child) el.appendChild(child);
                }
            }
            return el;
        }

        function clearElement(el) {
            while (el.firstChild) el.removeChild(el.firstChild);
        }

        function getHeatClass(count) {
            if (count === 0) return 'heat-0';
            if (count === 1) return 'heat-1';
            if (count === 2) return 'heat-2';
            if (count === 3) return 'heat-3';
            return 'heat-high';
        }

        function getRiskClass(score) {
            if (score >= 70) return 'risk-high';
            if (score >= 40) return 'risk-medium';
            return 'risk-low';
        }

        async function loadCampaignOptions() {
            try {
                const response = await fetch(API_BASE + '/campaigns');
                if (!response.ok) return;
                const campaigns = await response.json();
                const select = document.getElementById('campaign-select');
                campaigns.forEach(function(c) {
                    const option = createElement('option', { value: c.id }, c.name);
                    select.appendChild(option);
                });
            } catch (err) {
                console.log('Campaigns not available');
            }
        }

        async function loadMITREMatrix(campaignId) {
            const container = document.getElementById('mitre-matrix');
            clearElement(container);

            try {
                let url = API_BASE + '/threats/mitre-matrix';
                if (campaignId) url += '?campaign_id=' + encodeURIComponent(campaignId);

                const response = await fetch(url);
                if (!response.ok) {
                    container.appendChild(createElement('p', { style: 'color:var(--text-secondary);' }, 'MITRE matrix API not available.'));
                    return;
                }

                const data = await response.json();
                let tacticsWithTech = 0;
                let totalFindings = 0;

                data.tactics.forEach(function(tactic) {
                    const column = createElement('div', { className: 'tactic-column' });
                    column.appendChild(createElement('div', { className: 'tactic-header' }, tactic.name));

                    if (tactic.techniques.length > 0) {
                        tacticsWithTech++;
                        tactic.techniques.forEach(function(tech) {
                            totalFindings += tech.count;
                            const heatClass = getHeatClass(tech.count);

                            const cell = createElement('div', { className: 'technique-cell ' + heatClass });
                            cell.appendChild(createElement('span', { className: 'tech-id' }, tech.id));
                            cell.appendChild(createElement('span', { className: 'tech-name' }, tech.name));
                            if (tech.count > 0) {
                                cell.appendChild(createElement('span', { className: 'tech-count' }, String(tech.count)));
                            }
                            column.appendChild(cell);
                        });
                    } else {
                        const empty = createElement('div', {
                            className: 'technique-cell heat-0',
                            style: 'color:var(--text-secondary);text-align:center;font-style:italic;'
                        }, 'No detections');
                        column.appendChild(empty);
                    }

                    container.appendChild(column);
                });

                document.getElementById('stat-tactics').textContent = String(tacticsWithTech);
                document.getElementById('stat-techniques').textContent = String(data.total_techniques_covered);
                document.getElementById('stat-findings').textContent = String(totalFindings);

            } catch (err) {
                container.appendChild(createElement('p', { style: 'color:var(--text-secondary);' }, 'Error loading MITRE matrix: ' + err.message));
            }
        }

        async function loadAttackChains(campaignId) {
            const container = document.getElementById('attack-chains-container');
            clearElement(container);

            if (!campaignId) {
                container.appendChild(createElement('p', { style: 'color:var(--text-secondary);' }, 'Select a campaign to view attack chains.'));
                return;
            }

            try {
                const response = await fetch(API_BASE + '/threats/attack-paths/' + encodeURIComponent(campaignId));
                if (!response.ok) return;

                const data = await response.json();

                if (data.paths.length === 0) {
                    container.appendChild(createElement('p', { style: 'color:var(--text-secondary);' }, 'No attack chains detected for this campaign.'));
                    return;
                }

                data.paths.forEach(function(path) {
                    const card = createElement('div', { className: 'chain-card' });

                    const riskClass = getRiskClass(path.risk_score);
                    const riskSpan = createElement('span', { className: 'chain-risk ' + riskClass }, 'Risk: ' + path.risk_score.toFixed(1));
                    const titleDiv = createElement('div', { className: 'chain-title' }, [path.chain_title, riskSpan]);
                    card.appendChild(titleDiv);
                    card.appendChild(createElement('p', { style: 'font-size:0.85rem;color:var(--text-secondary);' }, path.description));

                    const stepsDiv = createElement('div', { className: 'chain-steps' });
                    path.steps.forEach(function(step, index) {
                        if (index > 0) {
                            stepsDiv.appendChild(createElement('span', { className: 'chain-arrow' }, '->'));
                        }
                        const stepEl = createElement('span', { className: 'chain-step' }, [
                            createElement('strong', null, step.type),
                            document.createTextNode(': ' + step.title.substring(0, 40))
                        ]);
                        stepsDiv.appendChild(stepEl);
                    });
                    card.appendChild(stepsDiv);

                    container.appendChild(card);
                });

            } catch (err) {
                container.appendChild(createElement('p', { style: 'color:var(--text-secondary);' }, 'Error loading attack chains.'));
            }
        }

        // Event listeners
        document.getElementById('campaign-select').addEventListener('change', function() {
            const campaignId = this.value;
            loadMITREMatrix(campaignId);
            loadAttackChains(campaignId);
        });

        // Initialize
        loadCampaignOptions();
        loadMITREMatrix('');
    </script>
</body>
</html>
