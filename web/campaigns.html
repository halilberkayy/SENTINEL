<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL - Red Team Campaign Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent-red: #ff3333;
            --accent-green: #00ff88;
            --accent-yellow: #ffd700;
            --accent-blue: #4488ff;
            --accent-purple: #aa55ff;
            --border-color: #2a2a3e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--accent-red);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: var(--accent-red); font-size: 1.5rem; }
        .header nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.2s;
        }
        .header nav a:hover, .header nav a.active { color: var(--accent-red); }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }
        .stat-card .value { font-size: 2.5rem; font-weight: bold; margin-bottom: 0.5rem; }
        .stat-card .label { color: var(--text-secondary); font-size: 0.9rem; }
        .stat-card.critical .value { color: var(--accent-red); }
        .stat-card.active .value { color: var(--accent-green); }
        .stat-card.targets .value { color: var(--accent-blue); }
        .stat-card.techniques .value { color: var(--accent-purple); }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .section-header h2 { color: var(--accent-red); }
        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--accent-red);
            background: transparent;
            color: var(--accent-red);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--accent-red); color: white; }
        .btn-small { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
        .campaigns-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }
        .campaigns-table th, .campaigns-table td {
            padding: 0.8rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .campaigns-table th {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .campaigns-table tr:hover { background: rgba(255, 51, 51, 0.05); }
        .phase-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .phase-recon { background: rgba(68, 136, 255, 0.2); color: var(--accent-blue); }
        .phase-initial_access { background: rgba(255, 215, 0, 0.2); color: var(--accent-yellow); }
        .phase-execution { background: rgba(255, 51, 51, 0.2); color: var(--accent-red); }
        .phase-persistence { background: rgba(170, 85, 255, 0.2); color: var(--accent-purple); }
        .phase-completed { background: rgba(0, 255, 136, 0.2); color: var(--accent-green); }
        .status-active { color: var(--accent-green); }
        .status-paused { color: var(--accent-yellow); }
        .status-completed { color: var(--text-secondary); }
        .severity-critical { color: #ff3333; }
        .findings-feed {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }
        .finding-item {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .finding-item:last-child { border-bottom: none; }
        .finding-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .finding-dot.critical { background: #ff3333; }
        .finding-dot.high { background: #ff6633; }
        .finding-dot.medium { background: #ffd700; }
        .finding-dot.low { background: #4488ff; }
        .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            padding: 2rem;
            width: 500px;
            max-width: 90%;
        }
        .modal h3 { color: var(--accent-red); margin-bottom: 1rem; }
        .modal input, .modal textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 0.8rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 4px;
        }
        .modal label {
            display: block;
            margin-bottom: 0.3rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>SENTINEL RED TEAM</h1>
        <nav>
            <a href="/">Scanner</a>
            <a href="/campaigns" class="active">Campaigns</a>
            <a href="/attack-map">ATT&CK Map</a>
        </nav>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card active">
                <div class="value" id="active-campaigns">0</div>
                <div class="label">Active Campaigns</div>
            </div>
            <div class="stat-card targets">
                <div class="value" id="total-targets">0</div>
                <div class="label">Total Targets</div>
            </div>
            <div class="stat-card critical">
                <div class="value" id="critical-findings">0</div>
                <div class="label">Critical Findings</div>
            </div>
            <div class="stat-card techniques">
                <div class="value" id="mitre-techniques">0</div>
                <div class="label">MITRE Techniques</div>
            </div>
        </div>

        <div class="section-header">
            <h2>Campaigns</h2>
            <button class="btn" onclick="showCreateModal()">+ New Campaign</button>
        </div>

        <table class="campaigns-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phase</th>
                    <th>Status</th>
                    <th>Targets</th>
                    <th>Findings</th>
                    <th>Critical</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="campaigns-body">
            </tbody>
        </table>

        <div class="two-col">
            <div>
                <div class="section-header">
                    <h2>Recent Findings</h2>
                </div>
                <div class="findings-feed" id="findings-feed">
                </div>
            </div>
            <div>
                <div class="section-header">
                    <h2>Phase Progress</h2>
                </div>
                <div id="phase-progress" style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:8px; padding:1rem;">
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="create-modal">
        <div class="modal">
            <h3>Create Campaign</h3>
            <label>Campaign Name</label>
            <input type="text" id="campaign-name" placeholder="Q1 2026 Penetration Test">
            <label>Description</label>
            <textarea id="campaign-desc" rows="2" placeholder="Authorized security assessment..."></textarea>
            <label>Allowed Domains (comma-separated)</label>
            <input type="text" id="campaign-domains" placeholder="example.com, *.example.com">
            <label>Objectives (comma-separated)</label>
            <input type="text" id="campaign-objectives" placeholder="Identify critical vulns, Test WAF bypass">
            <div class="modal-actions">
                <button class="btn" onclick="hideCreateModal()">Cancel</button>
                <button class="btn" onclick="createCampaign()" style="background:var(--accent-red);color:white;">Create</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        function showCreateModal() {
            document.getElementById('create-modal').classList.add('active');
        }

        function hideCreateModal() {
            document.getElementById('create-modal').classList.remove('active');
        }

        function createTextNode(text) {
            return document.createTextNode(text);
        }

        function createElement(tag, attrs, children) {
            const el = document.createElement(tag);
            if (attrs) {
                for (const [key, value] of Object.entries(attrs)) {
                    if (key === 'className') el.className = value;
                    else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
                    else el.setAttribute(key, value);
                }
            }
            if (children) {
                for (const child of (Array.isArray(children) ? children : [children])) {
                    if (typeof child === 'string') el.appendChild(createTextNode(child));
                    else if (child) el.appendChild(child);
                }
            }
            return el;
        }

        async function createCampaign() {
            const name = document.getElementById('campaign-name').value;
            const description = document.getElementById('campaign-desc').value;
            const domains = document.getElementById('campaign-domains').value.split(',').map(function(d) { return d.trim(); }).filter(Boolean);
            const objectives = document.getElementById('campaign-objectives').value.split(',').map(function(o) { return o.trim(); }).filter(Boolean);

            if (!name || domains.length === 0) {
                alert('Name and at least one domain are required.');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/campaigns', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        description: description,
                        scope: { allowed_domains: domains, allowed_ips: [], excluded_paths: [] },
                        objectives: objectives
                    })
                });

                if (response.ok) {
                    hideCreateModal();
                    loadCampaigns();
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.detail || 'Failed to create campaign'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function renderCampaignRow(campaign) {
            const tr = document.createElement('tr');

            const tdName = createElement('td', null, [createElement('strong', null, campaign.name)]);
            const phaseBadge = createElement('span', { className: 'phase-badge phase-' + campaign.phase }, campaign.phase.replace(/_/g, ' '));
            const tdPhase = createElement('td', null, [phaseBadge]);
            const statusSpan = createElement('span', { className: 'status-' + campaign.status }, campaign.status);
            const tdStatus = createElement('td', null, [statusSpan]);
            const tdTargets = createElement('td', null, String(campaign.targets_count || 0));
            const tdFindings = createElement('td', null, String(campaign.findings_count || 0));
            const tdCritical = createElement('td', { className: 'severity-critical' }, String(campaign.critical_findings || 0));

            const viewBtn = createElement('button', {
                className: 'btn btn-small',
                onclick: function() { viewCampaign(campaign.id); }
            }, 'View');
            const tdActions = createElement('td', null, [viewBtn]);

            tr.appendChild(tdName);
            tr.appendChild(tdPhase);
            tr.appendChild(tdStatus);
            tr.appendChild(tdTargets);
            tr.appendChild(tdFindings);
            tr.appendChild(tdCritical);
            tr.appendChild(tdActions);

            return tr;
        }

        async function loadCampaigns() {
            try {
                const response = await fetch(API_BASE + '/campaigns');
                if (!response.ok) return;

                const campaigns = await response.json();
                const tbody = document.getElementById('campaigns-body');

                // Clear existing rows
                while (tbody.firstChild) {
                    tbody.removeChild(tbody.firstChild);
                }

                if (campaigns.length === 0) {
                    const emptyRow = createElement('tr', null, [
                        createElement('td', { colspan: '7', style: 'text-align:center;color:var(--text-secondary);padding:2rem;' }, 'No campaigns yet. Create one to get started.')
                    ]);
                    tbody.appendChild(emptyRow);
                    return;
                }

                let activeCampaigns = 0;
                let totalTargets = 0;
                let totalCritical = 0;

                campaigns.forEach(function(c) {
                    if (c.status === 'active') activeCampaigns++;
                    totalTargets += c.targets_count || 0;
                    totalCritical += c.critical_findings || 0;
                    tbody.appendChild(renderCampaignRow(c));
                });

                document.getElementById('active-campaigns').textContent = String(activeCampaigns);
                document.getElementById('total-targets').textContent = String(totalTargets);
                document.getElementById('critical-findings').textContent = String(totalCritical);
            } catch (err) {
                console.log('Campaign API not available:', err.message);
                var tbody = document.getElementById('campaigns-body');
                while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
                var msg = createElement('tr', null, [
                    createElement('td', { colspan: '7', style: 'text-align:center;color:var(--text-secondary);padding:2rem;' }, 'Campaign API not available. Start the API server.')
                ]);
                tbody.appendChild(msg);
            }
        }

        function viewCampaign(id) {
            alert('Campaign detail view: ' + id + '\nAPI: GET /api/v1/campaigns/' + id);
        }

        // Initialize
        var phaseProgress = document.getElementById('phase-progress');
        phaseProgress.appendChild(createElement('p', { style: 'color:var(--text-secondary);text-align:center;' }, 'Select a campaign to view phases.'));

        var findingsFeed = document.getElementById('findings-feed');
        findingsFeed.appendChild(createElement('div', { className: 'finding-item', style: 'color:var(--text-secondary);justify-content:center;' }, 'No findings yet.'));

        loadCampaigns();
    </script>
</body>
</html>
